    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        // Intercept and suppress external script errors in capturing phase
        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var src = event.filename || '';
          if (
            msg === 'Script error.' ||
            !msg ||
            msg.indexOf('disqus') !== -1 ||
            src.indexOf('disqus') !== -1 ||
            src.indexOf('doubleclick') !== -1 ||
            src.indexOf('google') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.onerror = function(message, source, lineno, colno, error) {
          // Return true to tell browser the error is handled
          return true;
        };

        window.addEventListener('unhandledrejection', function(event) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-['Plus_Jakarta_Sans',sans-serif]">

  </body>
